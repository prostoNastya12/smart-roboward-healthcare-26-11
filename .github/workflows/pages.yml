name: Deploy site to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

# Two jobs: "build" uploads the site, "deploy" publishes it once that job has finished.
# Uploading and deploying in one job sometimes failed with "No artifacts named github-pages were found",
# because the uploaded artifact was not listed yet when the deploy step asked for it.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Publish only the intended static files (no build step needed): the five pages, the 3D model and its preview image.
      # The plain Clinic-World.html console is not published; the Live simulation page is built from it (gate/build-hacker.cjs).
      # shared-lift-replay.html is an HTML fragment, not a standalone page, so it is excluded.
      - name: Stage site files
        run: |
          mkdir _site
          cp site/index.html site/live-simulation.html site/incident-review.html site/gate-results.html site/security-pipelines.html site/ward-safety.html _site/
          cp output/visualizations/Smart-RoboWard-replay.html _site/lift-replay.html
          cp output/visualizations/Clinic-World.glb output/visualizations/Clinic-World-3D.png _site/
          touch _site/.nojekyll
          ls -la _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
